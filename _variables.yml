keybind:
  palette: "{{< kbd mac=Command-Shift-P win=Ctrl-Shift-P linux=Ctrl-Shift-P >}}"
  open-file: "{{< kbd mac=Command-. win=Ctrl-. linux=Ctrl-. >}}"
  commit: '{{< kbd mac=Command-Option-M win=Ctrl-Alt-M linux=Ctrl-Alt-M >}} or with the Palette ({{< var keybind.palette >}}, then type "commit")'
  chunk: '{{< kbd mac=Command-Option-I win=Ctrl-Alt-I linux=Ctrl-Alt-I >}} or with the Palette ({{< var keybind.palette >}}, then type "new chunk")'
  restart-r: '{{< kbd mac=Command-Shift-F10 win=Ctrl-Shift-F10 linux=Ctrl-Shift-F10 >}} or with the Palette ({{< var keybind.palette >}}, then type "restart")'
  source: '{{< kbd mac=Command-Shift-S win=Ctrl-Shift-S linux=Ctrl-Shift-S >}} or with the Palette ({{< var keybind.palette >}}, then type "source")'
  render: '{{< kbd mac=Command-Shift-K win=Ctrl-Shift-K linux=Ctrl-Shift-K >}} or with the Palette ({{< var keybind.palette >}}, then type "render")'
  roxygen: '{{< kbd mac=Command-Shift-Option-R win=Ctrl-Shift-Alt-R linux=Ctrl-Shift-Alt-R >}} or with the Palette ({{< var keybind.palette >}}, then type "roxygen comment")'
  outline: '{{< kbd mac=Command-Shift-O win=Ctrl-Shift-O linux=Ctrl-Shift-O >}} or with the Palette ({{< var keybind.palette >}}, then type "outline")'
  style: 'the Palette ({{< var keybind.palette >}}, then type "style file")'
  targets-make: 'the Palette ({{< var keybind.palette >}}, then type "targets run")'
  targets-vis: 'the Palette ({{< var keybind.palette >}}, then type "targets visual")'
  targets-outdated: 'the Palette ({{< var keybind.palette >}}, then type "targets outdated")'
  build-site: "{{< kbd mac=Command-Shift-B win=Ctrl-Shift-B linux=Ctrl-Shift-B >}}"
  find: '{{< kbd mac=Command-Shift-F win=Ctrl-Shift-F linux=Ctrl-Shift-F >}} or with the Palette ({{< var keybind.palette >}}, then type "find files")'
  visual-edit: "{{< kbd mac=Command-Shift-F4 win=Ctrl-Shift-F4 linux=Ctrl-Shift-F4 >}}"
  pipe: "{{< kbd mac=Command-Shift-M win=Ctrl-Shift-M linux=Ctrl-Shift-M >}}"
  code-section: '{{< kbd mac=Command-Shift-R win=Ctrl-Shift-R linux=Ctrl-Shift-R >}} or with the Palette ({{< var keybind.palette >}}, then type "code section")'
  run-code: "{{< kbd mac=Command-Enter win=Ctrl-Enter linux=Ctrl-Enter >}}"
